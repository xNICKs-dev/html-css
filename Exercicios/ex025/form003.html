<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste de formulario</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <p><label for="Nome">Nome:</label><input type="text" name="Nome" id="Nome" maxlength="30"placeholder="Nome completo" autocomplete="name" size="10" required></p>
        <p><label for="Nota">Nota:</label> <input type="number" name="Nota" id="Nota" min="0" max="10" placeholder="0 a 10" step="0.1" required value="5"></p>
        <p><label for="Data">Periodo Letivo:</label><input type="month" name="Data" id="Data"></p>
        <p><label for="Dia">Dia da prova:</label><input type="date" name="Dia" id="Dia"></p>
        <p><label for="Hora">Horario de correção:</label><input type="time" name="Hora" id="Hora"></p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
