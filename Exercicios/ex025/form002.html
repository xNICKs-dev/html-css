<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="user">Usuario:</label>
            <input type="text" name="user" id="user" size="10" placeholder="Email" autocomplete="username">
        </p>
        <p>
            <label for="key">Senha:</label>
            <input type="password" name="key" id="key" required minlength="7" maxlength="12" size="10" placeholder="Senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
