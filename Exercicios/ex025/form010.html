<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <p>
            <label for="ano">Em que ano você nasceu</label>
            <input type="number" name="iano" id="ano" min="1900" max="2025" oninput="calcIdade()">
        </p>
        <p>
            <label for="ida">Você tem ou vai fazer: </label>
            <output id="ida">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            ida.innerHTML = Number(atual) - Number(ano.value)
        }
    </script>
</body>
</html>
