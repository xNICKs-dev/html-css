<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
            background-color: darkgray;
            flex-direction: row;
            height: 600px;
            align-content: flex-start;
        }
        .red{
            background-color: red;
            width: 200px;
            height: 200px;
        }
        .blue{
            background-color: blue;
            width: 200px;
            height: 200px;
        }
        .green{
            background-color: green;
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="red"></div>
        <div class="blue"></div>
        <div class="green"></div>
    </div>
</body>
</html>
