<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container{
            display: flex;
            background-color: lightgray;   
            flex-flow: row nowrap;    
        
        }
        div.item{
            flex-basis: 200px;
            background-color: black;
            color: white;   
            text-align: center;
            border: 1px solid darkgray;
        }
        div#a{
          flex: 1 1 150px;
        }
        div#b{
           flex: 1 1 150px;
        }
        div#c{
            flex: 1 1 150px;
        }
    </style>
</head>
<body>
    <div class="container">
            <div class="item" id="a">A</div>
            <div class="item" id="b">B</div>
            <div class="item" id="c">C</div>

    </div>

</body>
</html>
