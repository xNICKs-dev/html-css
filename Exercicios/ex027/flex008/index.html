<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container{
            display: flex;
            background-color: lightgray;   
            height: 600px;    
        
        }
        div.item{
            background-color: black;
            color: white;
                align-self: center;     
                text-align: center;
                border: 1px solid darkgray;
                padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
            <div class="item" style="align-self: flex-end;">A</div>
            <div class="item" style="align-self: flex-start;">B</div>
            <div class="item" style="align-self: stretch;">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
    </div>

</body>
</html>
